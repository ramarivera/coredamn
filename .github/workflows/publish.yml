name: Check and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version tag after verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: coredamn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
      - run: pnpm check
      - run: pnpm package
      - run: pnpm check:package
      - run: python3 scripts/tui-proof.py
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.equal(process.env.RELEASE_TAG, "v" + JSON.parse(fs.readFileSync("package.json")).version)'

  publish:
    needs: verify
    if: >-
      github.repository == 'ramarivera/coredamn' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: "true"
      - run: pnpm package
      - name: Publish the verified tarball using npm OIDC
        # No registry token or NODE_AUTH_TOKEN is configured.
        run: node scripts/publish.mjs
